<title>Phone Log Flashcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<style>
/* Layout: one index card on a desk, deck filter above, grading bar below; a list view for a full read-through. */
:root {
  --bg: #e9edf2;
  --surface: #f7f9fb;
  --card: #fffffe;
  --ink: #18212c;
  --muted: #586473;
  --line: #cdd7e3;
  --margin: #d2564f;
  --accent: #1d5bb8;
  --accent-soft: #e2ebf8;
  --good: #2b7a4b;
  --good-soft: #e1f1e7;
  --again: #b04f25;
  --again-soft: #f8e7de;
  --code-bg: #eef2f7;
  --chart-bg: #f3f6fa;
  --node-bg: #ffffff;
  --decision-bg: #fff6e0;
  --decision-line: #b38415;
  --d-ov: #8a6a12;
  --d-wf1: #23806f;
  --d-wf2: #1d5bb8;
  --d-mail: #7b4bb3;
  --d-terms: #b04f25;
  --shadow: 0 1px 2px rgba(24,33,44,.06), 0 8px 24px rgba(24,33,44,.08);
  --font-body: "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #161d26; --card: #1b2430; --ink: #e5eaf0; --muted: #9ba7b5;
    --line: #2b3746; --margin: #c25a53; --accent: #7ea8f5; --accent-soft: #1f2d44;
    --good: #6cc492; --good-soft: #193326; --again: #ec9468; --again-soft: #3a2419; --code-bg: #232e3c;
    --chart-bg: #141b24; --node-bg: #1f2a37; --decision-bg: #33291a; --decision-line: #d8b75a;
    --d-ov: #d8b75a; --d-wf1: #62c7b1; --d-wf2: #7ea8f5; --d-mail: #b797e6; --d-terms: #ec9468;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #161d26; --card: #1b2430; --ink: #e5eaf0; --muted: #9ba7b5;
  --line: #2b3746; --margin: #c25a53; --accent: #7ea8f5; --accent-soft: #1f2d44;
  --good: #6cc492; --good-soft: #193326; --again: #ec9468; --again-soft: #3a2419; --code-bg: #232e3c;
  --chart-bg: #141b24; --node-bg: #1f2a37; --decision-bg: #33291a; --decision-line: #d8b75a;
  --d-ov: #d8b75a; --d-wf1: #62c7b1; --d-wf2: #7ea8f5; --d-mail: #b797e6; --d-terms: #ec9468;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap {
  max-width: 860px; margin: 0 auto;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 { margin: 0; font-size: 1.6rem; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: .9rem; max-width: 60ch; }
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 180px; }
.stat-num { font-variant-numeric: tabular-nums; font-size: .9rem; color: var(--muted); }
.stat-num b { color: var(--ink); font-size: 1.1rem; }
.bar { width: 180px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--good); transition: width .3s ease; }

.toolbar { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.label { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.chip {
  font: inherit; font-size: .85rem; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 4px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .8rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: .85rem; cursor: pointer; border: 0; background: var(--surface); color: var(--ink); padding: 5px 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--card); }
.ghost { font: inherit; font-size: .85rem; cursor: pointer; background: none; border: 1px solid var(--line); color: var(--ink); padding: 5px 12px; border-radius: 8px; }
button:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.stage { display: flex; flex-direction: column; gap: 14px; }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.deck-tag { display: inline-flex; align-items: center; gap: 6px; }
.deck-tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.boxes { display: inline-flex; gap: 3px; align-items: center; }
.boxes i { width: 14px; height: 6px; border-radius: 2px; background: var(--line); }
.boxes i.on { background: var(--good); }
.card { perspective: 1800px; cursor: pointer; border-radius: 10px; }
.card-inner { display: grid; grid-template-columns: minmax(0, 1fr); transition: transform .45s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; }
.card.flipped .card-inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  min-height: 300px; padding: 26px 26px 20px 44px; position: relative; min-width: 0;
  display: flex; flex-direction: column; gap: 12px;
}
.face::before { content: ""; position: absolute; top: 0; bottom: 0; left: 28px; width: 1.5px; background: var(--margin); opacity: .55; }
.front { justify-content: center; }
.kind {
  align-self: flex-start; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
  padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted);
}
.kind.logic { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.front .q { font-size: 1.3rem; line-height: 1.5; font-weight: 600; text-wrap: balance; margin: 0; }
.front .hint { color: var(--muted); font-size: .8rem; margin-top: auto; }
.back { transform: rotateY(180deg); }
.back .q-small { font-size: .85rem; color: var(--muted); margin: 0; }
.ans { font-size: .97rem; line-height: 1.7; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 10px; }
.ans p { margin: 0; }
.ans ul, .ans ol { margin: 0; padding-left: 20px; }
.ans li { margin: 1px 0; }
.ans b { font-weight: 600; }
code { font-family: var(--font-mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.flowchart {
  background: var(--chart-bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px; overflow-x: auto; min-height: 80px; display: flex; justify-content: center;
}
.flowchart svg { max-width: 100%; height: auto; }
.flowchart.loading::after { content: "กำลังวาด flowchart…"; color: var(--muted); font-size: .85rem; align-self: center; }
.flowchart pre { margin: 0; font-family: var(--font-mono); font-size: .75rem; white-space: pre; color: var(--ink); }
.ex { background: var(--good-soft); border-radius: 6px; padding: 8px 12px; font-size: .9rem; }
.ex::before { content: "ตัวอย่างจริงจาก Dev"; display: block; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; color: var(--good); margin-bottom: 2px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: .86rem; width: 100%; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: .78rem; }
.src { margin-top: auto; font-size: .76rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }

.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grade button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 12px 10px; border: 1.5px solid; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.grade button small { font-weight: 400; font-size: .75rem; opacity: .8; }
.btn-again { background: var(--again-soft); color: var(--again); border-color: var(--again); }
.btn-know { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.btn-flip { grid-column: 1 / -1; background: var(--surface); color: var(--ink); border-color: var(--line) !important; }
.keys { font-size: .78rem; color: var(--muted); text-align: center; }
kbd { font-family: var(--font-mono); font-size: .75rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

.done { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 32px 28px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.done h2 { margin: 0; font-size: 1.3rem; }
.done p { margin: 0; color: var(--muted); }

.list { display: flex; flex-direction: column; gap: 28px; }
.list h2 { font-size: 1.05rem; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.list h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.list ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.list li { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.list .lq { font-weight: 600; margin: 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.list .src { border: 0; padding: 0; }

@media (max-width: 520px) {
  .face { padding: 20px 16px 16px 32px; min-height: 260px; }
  .face::before { left: 20px; }
  .front .q { font-size: 1.12rem; }
  .stat { align-items: flex-start; }
  .flowchart { padding: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .card-inner { transition: none; }
  .bar > i { transition: none; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Phone Log Flashcards</h1>
      <p class="sub">สิ่งที่โปรแกรมเมอร์ต้องรู้เรื่อง <code>mgw_flow_findmatter</code> และ <code>mgw_flow_logenquiry</code> ได้แก่ ชื่อ, input, output, ตาราง และ logic การ์ด Logic ทุกใบตอบด้วย Mermaid flowchart แล้วตามด้วยตัวอย่างจริงจาก Dev</p>
    </div>
    <div class="stat" aria-live="polite">
      <span class="stat-num">แม่นแล้ว <b id="mastered">0</b> / <span id="total">0</span> ใบ</span>
      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="row" id="decks" role="group" aria-label="เลือกหมวด"></div>
    <div class="row">
      <div class="seg" role="group" aria-label="มุมมอง">
        <button type="button" id="view-practice" aria-pressed="true">ฝึก</button>
        <button type="button" id="view-list" aria-pressed="false">ดูทั้งหมด</button>
      </div>
      <div class="seg" role="group" aria-label="การ์ดที่จะฝึก" id="mode-seg">
        <button type="button" id="mode-all" aria-pressed="true">ทุกใบ</button>
        <button type="button" id="mode-weak" aria-pressed="false">เฉพาะที่ยังไม่แม่น</button>
      </div>
      <div class="seg" role="group" aria-label="ชนิดการ์ด">
        <button type="button" id="kind-all" aria-pressed="true">ทุกชนิด</button>
        <button type="button" id="kind-logic" aria-pressed="false">Logic</button>
        <button type="button" id="kind-fact" aria-pressed="false">Fact</button>
      </div>
      <button type="button" class="ghost" id="shuffle">สลับลำดับ</button>
      <button type="button" class="ghost" id="reset">ล้างผลการจำ</button>
    </div>
  </div>

  <section class="stage" id="practice">
    <div class="meta">
      <span class="deck-tag" id="deck-tag"><span class="dot"></span><span></span></span>
      <span><span class="boxes" id="boxes" title="ระดับการจำ"><i></i><i></i><i></i></span> &nbsp;<span id="pos"></span></span>
    </div>
    <div class="card" id="card" tabindex="0" role="button" aria-label="พลิกการ์ด">
      <div class="card-inner">
        <div class="face front">
          <span class="kind" id="kind"></span>
          <p class="q" id="q"></p>
          <span class="hint" id="hint"></span>
        </div>
        <div class="face back" aria-live="polite">
          <p class="q-small" id="q2"></p>
          <div class="ans" id="a"></div>
          <div class="src" id="src"></div>
        </div>
      </div>
    </div>
    <div class="grade">
      <button type="button" class="btn-flip" id="btn-flip">ดูคำตอบ<small>Space</small></button>
      <button type="button" class="btn-again" id="btn-again" hidden>ยังไม่แม่น<small>กด 1 · ใบนี้จะวนกลับมาในรอบนี้</small></button>
      <button type="button" class="btn-know" id="btn-know" hidden>จำได้<small>กด 2 · ไปใบถัดไป</small></button>
    </div>
    <div class="keys"><kbd>Space</kbd> พลิก · <kbd>1</kbd> ยังไม่แม่น · <kbd>2</kbd> จำได้</div>
  </section>

  <section class="done" id="done" hidden>
    <h2>จบรอบนี้แล้ว</h2>
    <p id="done-text"></p>
    <div class="row">
      <button type="button" class="ghost" id="again-weak">ทวนเฉพาะที่ยังไม่แม่น</button>
      <button type="button" class="ghost" id="again-all">เริ่มใหม่ทุกใบ</button>
    </div>
  </section>

  <section class="list" id="list" hidden></section>
</div>

<script>
const DECKS = [
  { id: 'ov',    name: 'ภาพรวมระบบ' },
  { id: 'wf1',   name: 'WF1 findmatter' },
  { id: 'wf2',   name: 'WF2 logenquiry' },
  { id: 'mail',  name: 'WF2 อีเมล (#150)' },
  { id: 'terms', name: 'คำที่สับสนง่าย' }
];

// kind: 'logic' = answer leads with a Mermaid flowchart; 'fact' = names, inputs, outputs, values.
const CARDS = [
  // ---------- ภาพรวม ----------
  { id: 'ov1', deck: 'ov', kind: 'logic', q: 'ระบบมีกี่ flow ชื่ออะไร ใครเรียก และเรียกตามลำดับไหน?',
    chart: `flowchart TD
  A([Caller]) --> B["Voice agent<br/>(ticket 153, not built yet)"]
  B -- "MatterNameGiven, ACNABN" --> C["WF1 mgw_flow_findmatter<br/>find one active case, read only"]
  C -- "MatchStatus, CaseCode, ClientName ..." --> D["Agent asks the caller:<br/>is it ClientName?"]
  D -- "MatchConfidence + 13 other inputs" --> E["WF2 mgw_flow_logenquiry<br/>ticket 149: write row + due date<br/>ticket 150: send one staff email"]
  E -- "RecordStatus, DateResponseRequired ..." --> F([Agent closes the call])`,
    ex: 'ผู้โทรบอก <code>TEST Harbour Bakery Pty Ltd</code> → WF1 ได้ <code>Candidate</code> <code>MG-TEST-0004</code> → ผู้โทรยืนยัน → WF2 ได้รับ <code>Confirmed</code> → เขียนแถว 1 แถวและส่งเมล 1 ฉบับ (T8)',
    src: 'ADO #148, #149, #150 · #153 = agent (ยังไม่สร้าง)' },
  { id: 'ov2', deck: 'ov', kind: 'fact', q: 'ทั้งสอง flow เป็น flow ชนิดไหน ใช้ trigger และ response อะไร?',
    a: `<ul>
      <li><b>Cloud flow</b> (Power Automate) อยู่<b>ใน solution</b> <code>MackayGoodwinCreditorEnquiry</code> เพื่อให้ agent เรียกได้</li>
      <li>Trigger: <b>When an agent calls the flow</b> (kind <code>Skills</code>)</li>
      <li>จบด้วย <b>Respond to the agent</b> และตั้ง Asynchronous response = <b>Off</b> (agent รอคำตอบ)</li>
      <li>Input และ output เป็น <b>Text</b> ทั้งหมด (date ส่งเป็นข้อความ <code>yyyy-MM-dd</code>)</li>
      <li>Input ถูกเก็บเป็น key <code>text</code>, <code>text_1</code>, <code>text_2</code> … ตามลำดับที่สร้าง ห้าม rename หลัง save</li></ul>`,
    src: '#148 decision 1 · #149 decision 1, B1' },
  { id: 'ov3', deck: 'ov', kind: 'fact', q: 'แต่ละ flow ใช้ connection reference และ environment variable อะไรบ้าง?',
    a: `<div class="tbl-wrap"><table><tr><th>Flow</th><th>Connection reference</th><th>Environment variable</th></tr>
      <tr><td>WF1</td><td><code>mgw_MGDataverse</code></td><td>ไม่มี (time zone พิมพ์ตรงในนิพจน์ <code>AppointmentDate</code>)</td></tr>
      <tr><td>WF2</td><td><code>mgw_MGDataverse</code>, <code>mgw_MGOutlook</code></td><td><code>MG_OperationsOwnerTeamId</code>, <code>MG_TimeZone</code>, <code>MG_ProductionEmailEnabled</code>, <code>MG_EmailRecipientOverride</code>, <code>MG_AdminEmail</code>, <code>MG_DataverseEnvironmentUrl</code></td></tr></table></div>
      <p>ทุก connection reference ต้องเป็น <b>Embedded</b> ไม่ใช่ "Provided by run-only user" ไม่งั้น agent เรียกแล้ว fail</p>`,
    src: '#148 B4 · #150 F2–F4 · GOTCHAS (Power Automate)' },
  { id: 'ov4', deck: 'ov', kind: 'fact', q: 'กับดักของ "Respond to the agent" ที่โปรแกรมเมอร์ต้องรู้มีอะไร?',
    a: `<ul>
      <li>Respond card ทุกใบที่มี status เดียวกันต้องมี <b>output ชุดเดียวกัน</b> ถ้าจะเพิ่ม output ต้องเพิ่มทุกใบใน save เดียว ไม่งั้น save fail ด้วย <code>ActionSchemaInvalid</code></li>
      <li>ค่าว่างต้องใช้นิพจน์ <code>string('')</code> ถ้าพิมพ์ <code>''</code> เป็นข้อความ จะได้เครื่องหมาย quote สองตัวจริง ๆ</li>
      <li>WF1 มี Respond 2 ใบ (ปกติ / <code>RespondFailed</code>) · WF2 มี 4 ใบ (<code>ResponseCreate</code>, <code>RespondExisting</code>, <code>RespondRace</code>, <code>RespondFailed</code>)</li></ul>`,
    src: '#150 F4 (วัดเมื่อ 09:20Z) · #149 B1 · #148 B6' },

  // ---------- WF1 ----------
  { id: 'w1a', deck: 'wf1', kind: 'fact', q: 'Flow แรกชื่ออะไร ทำหน้าที่อะไร อ่านหรือเขียนตารางไหน?',
    a: `<ul>
      <li>ชื่อ <code>mgw_flow_findmatter</code> (Workflow 1, ADO #148)</li>
      <li>หน้าที่: หา<b>เคส active หนึ่งเคส</b>จากชื่อบริษัทหรือ ACN/ABN ที่ผู้โทรบอก โดยไม่บอกชื่อเคสอื่นให้ผู้โทรรู้ (zero candidate leakage)</li>
      <li><b>อ่านอย่างเดียว</b> จาก <code>mgw_caseregistry</code> ด้วย List rows ครั้งเดียว (top 10, เรียง <code>mgw_appointedon desc</code>) และไม่เขียนอะไรเลย</li>

// ---------- Mermaid rendering ----------
const svgCache = new Map();
let mmSeq = 0, mmTheme = '';

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function setupMermaid() {
  if (!window.mermaid) return false;
  const key = cssVar('--card') + cssVar('--ink');
  if (key === mmTheme) return true;
  mmTheme = key;
  svgCache.clear();
  window.mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'strict',
    theme: 'base',
    fontFamily: 'IBM Plex Sans Thai, Leelawadee UI, Tahoma, sans-serif',
    flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis', padding: 10, nodeSpacing: 30, rankSpacing: 36 },
    themeVariables: {
      background: cssVar('--chart-bg'),
      primaryColor: cssVar('--node-bg'),
      primaryBorderColor: cssVar('--accent'),
      primaryTextColor: cssVar('--ink'),
      secondaryColor: cssVar('--decision-bg'),
      tertiaryColor: cssVar('--chart-bg'),
      lineColor: cssVar('--muted'),
      textColor: cssVar('--ink'),
      edgeLabelBackground: cssVar('--chart-bg'),
      clusterBkg: cssVar('--accent-soft'),
      clusterBorder: cssVar('--line'),
      fontSize: '14px'
    }
  });
  return true;
}

function decorate(code) {
  // Decisions (diamonds) get their own colour so a reader finds the branch points at a glance.
  const ids = [...code.matchAll(/(\w+)\{"/g)].map(m => m[1]);
  if (!ids.length) return code;
  return code + `\n  classDef decision fill:${cssVar('--decision-bg')},stroke:${cssVar('--decision-line')},color:${cssVar('--ink')}\n  class ${[...new Set(ids)].join(',')} decision`;
}

async function drawChart(el, code) {
  el.dataset.code = code;
  if (!setupMermaid()) {
    el.classList.remove('loading');
    el.innerHTML = '';
    const pre = document.createElement('pre');
    pre.textContent = code;
    el.appendChild(pre);
    return;
  }
  const full = decorate(code);
  if (svgCache.has(full)) { el.classList.remove('loading'); el.innerHTML = svgCache.get(full); return; }
  el.classList.add('loading');
  try {
    const { svg } = await window.mermaid.render('mm' + (++mmSeq), full);
    svgCache.set(full, svg);
    if (el.dataset.code === code) { el.innerHTML = svg; }
  } catch (e) {
    if (el.dataset.code === code) {
      el.innerHTML = '';
      const pre = document.createElement('pre');
      pre.textContent = code;
      el.appendChild(pre);
    }
  } finally {
    el.classList.remove('loading');
  }
}

function redrawAll() {
  mmTheme = '';
  document.querySelectorAll('.flowchart[data-code]').forEach(el => drawChart(el, el.dataset.code));
}
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawAll); } catch (e) {}
new MutationObserver(redrawAll).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------- Flashcard logic ----------
const STORE_KEY = 'phone-log-flashcards-v2';
function loadBoxes() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { return {}; } }
function saveBoxes() { try { localStorage.setItem(STORE_KEY, JSON.stringify(boxes)); } catch (e) { /* storage blocked: progress lives in this tab only */ } }

let boxes = loadBoxes();
let activeDecks = new Set(DECKS.map(d => d.id));
let mode = 'all';
let kindFilter = 'all';
let view = 'practice';
let shuffled = false;
let queue = [], pos = 0, flipped = false, sessionKnow = 0, sessionAgain = 0;

const $ = id => document.getElementById(id);
const deckName = id => DECKS.find(d => d.id === id).name;
const deckColor = id => `var(--d-${id})`;
const level = id => boxes[id] || 0;
const inScope = c => activeDecks.has(c.deck) && (kindFilter === 'all' || c.kind === kindFilter);

function fillAnswer(el, c) {
  el.innerHTML = '';
  if (c.chart) {
    const box = document.createElement('div');
    box.className = 'flowchart loading';
    box.setAttribute('role', 'img');
    box.setAttribute('aria-label', 'Flowchart: ' + c.q);
    el.appendChild(box);
    drawChart(box, c.chart);
  }
  if (c.a) { const d = document.createElement('div'); d.innerHTML = c.a; while (d.firstChild) el.appendChild(d.firstChild); }
  if (c.ex) { const d = document.createElement('div'); d.className = 'ex'; d.innerHTML = c.ex; el.appendChild(d); }
}

function kindLabel(c) { return c.kind === 'logic' ? 'Logic · flowchart' : 'Fact'; }

function renderDecks() {
  const el = $('decks');
  el.innerHTML = '<span class="label">หมวด</span>';
  const all = document.createElement('button');
  all.type = 'button'; all.className = 'chip';
  all.setAttribute('aria-pressed', String(activeDecks.size === DECKS.length));
  all.innerHTML = `ทั้งหมด <span class="n">${CARDS.length}</span>`;
  all.onclick = () => { activeDecks = new Set(DECKS.map(d => d.id)); restart(); };
  el.appendChild(all);
  DECKS.forEach(d => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.style.setProperty('--c', deckColor(d.id));
    b.setAttribute('aria-pressed', String(activeDecks.size === 1 && activeDecks.has(d.id)));
    b.innerHTML = `<span class="dot"></span>${d.name} <span class="n">${CARDS.filter(c => c.deck === d.id).length}</span>`;
    b.onclick = () => { activeDecks = new Set([d.id]); restart(); };
    el.appendChild(b);
  });
}

function renderStats() {
  const m = CARDS.filter(c => level(c.id) >= 2).length;
  $('mastered').textContent = m;
  $('total').textContent = CARDS.length;
  $('bar').style.width = (m / CARDS.length * 100) + '%';
}

function buildQueue() {
  let list = CARDS.filter(inScope);
  if (mode === 'weak') list = list.filter(c => level(c.id) < 2);
  if (shuffled) {
    list = list.slice();
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  }
  return list;
}

function restart() { queue = buildQueue(); pos = 0; flipped = false; sessionKnow = 0; sessionAgain = 0; renderDecks(); render(); }

function setFlip(v) {
  flipped = v;
  $('card').classList.toggle('flipped', v);
  $('btn-flip').hidden = v;
  $('btn-again').hidden = !v;
  $('btn-know').hidden = !v;
  $('card').setAttribute('aria-label', v ? 'ด้านคำตอบ แตะเพื่อพลิกกลับ' : 'พลิกการ์ด');
}

function render() {
  renderStats();
  const practice = view === 'practice';
  $('list').hidden = practice;
  $('mode-seg').style.visibility = practice ? 'visible' : 'hidden';
  $('shuffle').hidden = !practice;
  if (!practice) { $('practice').hidden = true; $('done').hidden = true; renderList(); return; }

  if (pos >= queue.length) {
    $('practice').hidden = true; $('done').hidden = false;
    const weak = CARDS.filter(c => inScope(c) && level(c.id) < 2).length;
    $('done-text').textContent = queue.length === 0
      ? 'ไม่มีการ์ดที่ยังไม่แม่นในตัวกรองนี้แล้ว เลือก "เริ่มใหม่ทุกใบ" เพื่อทวนอีกรอบ'
      : `รอบนี้กด "จำได้" ${sessionKnow} ครั้ง และ "ยังไม่แม่น" ${sessionAgain} ครั้ง · ในตัวกรองนี้ยังเหลือการ์ดที่ยังไม่แม่น ${weak} ใบ`;
    return;
  }
  $('practice').hidden = false; $('done').hidden = true;
  const c = queue[pos];
  const tag = $('deck-tag');
  tag.style.setProperty('--c', deckColor(c.deck));
  tag.lastElementChild.textContent = deckName(c.deck);
  [...$('boxes').children].forEach((i, k) => i.classList.toggle('on', k < level(c.id)));
  $('pos').textContent = `${pos + 1} / ${queue.length}`;
  const k = $('kind');
  k.textContent = kindLabel(c);
  k.className = 'kind' + (c.kind === 'logic' ? ' logic' : '');
  $('hint').textContent = c.kind === 'logic'
    ? 'ลองวาด flowchart ในหัวก่อน แล้วแตะการ์ดหรือกด Space เพื่อเทียบ'
    : 'ลองตอบให้ครบก่อน แล้วแตะการ์ดหรือกด Space';
  $('q').textContent = c.q;
  $('q2').textContent = c.q;
  fillAnswer($('a'), c);
  $('src').textContent = 'ที่มา: ' + c.src;
  setFlip(false);
}

function grade(know) {
  if (!flipped || pos >= queue.length) return;
  const c = queue[pos];
  if (know) { boxes[c.id] = Math.min(3, level(c.id) + 1); sessionKnow++; }
  else { boxes[c.id] = 1; sessionAgain++; queue.splice(Math.min(queue.length, pos + 4), 0, c); }
  saveBoxes();
  pos++;
  render();
  $('card').focus({ preventScroll: true });
}

function renderList() {
  const el = $('list');
  el.innerHTML = '';
  DECKS.filter(d => activeDecks.has(d.id)).forEach(d => {
    const cards = CARDS.filter(c => c.deck === d.id && inScope(c));
    if (!cards.length) return;
    const sec = document.createElement('div');
    sec.innerHTML = `<h2 style="--c:${deckColor(d.id)}"><span class="dot"></span>${d.name}</h2>`;
    const ol = document.createElement('ol');
    cards.forEach(c => {
      const li = document.createElement('li');
      li.innerHTML = `<p class="lq"><span class="kind${c.kind === 'logic' ? ' logic' : ''}"></span><span class="t"></span></p><div class="ans"></div><div class="src"></div>`;
      li.querySelector('.kind').textContent = kindLabel(c);
      li.querySelector('.t').textContent = c.q;
      fillAnswer(li.querySelector('.ans'), c);
      li.querySelector('.src').textContent = 'ที่มา: ' + c.src;
      ol.appendChild(li);
    });
    sec.appendChild(ol);
    el.appendChild(sec);
  });
}

function press(group, onId) { group.forEach(id => $(id).setAttribute('aria-pressed', String(id === onId))); }

$('card').addEventListener('click', () => { if (pos < queue.length) setFlip(!flipped); });
$('btn-flip').onclick = () => setFlip(true);
$('btn-again').onclick = () => grade(false);
$('btn-know').onclick = () => grade(true);
$('view-practice').onclick = () => { view = 'practice'; press(['view-practice', 'view-list'], 'view-practice'); render(); };
$('view-list').onclick = () => { view = 'list'; press(['view-practice', 'view-list'], 'view-list'); render(); };
$('mode-all').onclick = () => { mode = 'all'; press(['mode-all', 'mode-weak'], 'mode-all'); restart(); };
$('mode-weak').onclick = () => { mode = 'weak'; press(['mode-all', 'mode-weak'], 'mode-weak'); restart(); };
['all', 'logic', 'fact'].forEach(k => {
  $('kind-' + k).onclick = () => { kindFilter = k; press(['kind-all', 'kind-logic', 'kind-fact'], 'kind-' + k); restart(); };
});
$('shuffle').onclick = () => { shuffled = true; restart(); };
$('again-all').onclick = () => { mode = 'all'; press(['mode-all', 'mode-weak'], 'mode-all'); restart(); };
$('again-weak').onclick = () => { mode = 'weak'; press(['mode-all', 'mode-weak'], 'mode-weak'); restart(); };
$('reset').onclick = () => {
  const btn = $('reset');
  if (btn.dataset.confirm !== '1') {
    btn.dataset.confirm = '1'; btn.textContent = 'กดอีกครั้งเพื่อยืนยัน';
    setTimeout(() => { btn.dataset.confirm = ''; btn.textContent = 'ล้างผลการจำ'; }, 3000);
    return;
  }
  boxes = {}; saveBoxes(); btn.dataset.confirm = ''; btn.textContent = 'ล้างผลการจำ'; restart();
};

document.addEventListener('keydown', e => {
  if (view !== 'practice' || e.ctrlKey || e.metaKey || e.altKey) return;
  const onControl = e.target && e.target.tagName === 'BUTTON';
  if ((e.key === ' ' || e.key === 'Enter') && !onControl) { e.preventDefault(); if (pos < queue.length) setFlip(!flipped); }
  else if (e.key === '1' || e.key === 'ArrowLeft') grade(false);
  else if (e.key === '2' || e.key === 'ArrowRight') grade(true);
});

restart();
</script>
